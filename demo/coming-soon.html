<!doctype html>
<html class="no-js" lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="">

  <!-- Site Title -->
  <title>Bexon - Corporate Business HTML Template</title>

  <!-- Place favicon.ico in the root directory -->
  <link rel="shortcut icon" type="image/x-icon" href="assets/images/fav.png">

  <!-- CSS here -->
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/font-awesome-pro.min.css">
  <link rel="stylesheet" href="assets/css/animate.min.css">
  <link rel="stylesheet" href="assets/css/bexon-icons.css">
  <link rel="stylesheet" href="assets/css/nice-select.css">
  <link rel="stylesheet" href="assets/css/swiper.min.css">
  <link rel="stylesheet" href="assets/css/venobox.min.css">
  <link rel="stylesheet" href="assets/css/odometer-theme-default.css">
  <link rel="stylesheet" href="assets/css/meanmenu.css">
  <link rel="stylesheet" href="assets/css/main.css">
</head>

<body>
  <div class="body-overlay"></div>

  <!-- Preloader Start -->
  <div class="tj-preloader is-loading">
    <div class="tj-preloader-inner">
      <div class="tj-preloader-ball-wrap">
        <div class="tj-preloader-ball-inner-wrap">
          <div class="tj-preloader-ball-inner">
            <div class="tj-preloader-ball"></div>
          </div>
          <div class="tj-preloader-ball-shadow"></div>
        </div>
        <div id="tj-weave-anim" class="tj-preloader-text">Loading...</div>
      </div>
    </div>
    <div class="tj-preloader-overlay"></div>
  </div>
  <!-- Preloader end -->

  <!-- Coming soon start -->
  <section class="tj-coming-soon-section">
    <div class="tj_coming_soon" data-bg-image="assets/images/bg/coming-soon-bg.webp">
      <div class="tj_coming_soon_wrap">
        <div class="tj_coming_soon_content">
          <h1 class="title">Coming Soon</h1>
          <div class="desc">Our new website is under development — smarter, faster, and more creative than ever.</div>
        </div>


        <div class="countdown" data-date="2026-12-31 12:00:00" data-day_label="Days" data-min_label="Mins"
          data-hour_label="Hours" data-sec_label="Sec">
          <div class="countdown-container days">
            <span class="countdown-value">00</span>
            <span class="countdown-heading">Days</span>
          </div>

          <span class="divider">:</span>

          <div class="countdown-container hours">
            <span class="countdown-value">00</span>
            <span class="countdown-heading">Hours</span>
          </div>

          <span class="divider">:</span>

          <div class="countdown-container minutes">
            <span class="countdown-value">00</span>
            <span class="countdown-heading">Mins</span>
          </div>

          <span class="divider">:</span>

          <div class="countdown-container seconds">
            <span class="countdown-value">00</span>
            <span class="countdown-heading">Sec</span>
          </div>
        </div>

        <div class="query_form">
          <form action="#">
            <input type="email" name="email" placeholder="Enter email address">
            <button type="submit"><i class="tj tji-plane"></i></button>
          </form>
          <span class="form_note">* Join the launch list here.</span>
        </div>
      </div>
    </div>
  </section>
  <!-- Coming soon end -->

  <!-- JS here -->
  <script src="assets/js/jquery.min.js"></script>
  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/gsap.min.js"></script>
  <script src="assets/js/ScrollSmoother.js"></script>
  <script src="assets/js/gsap-scroll-to-plugin.min.js"></script>
  <script src="assets/js/gsap-scroll-trigger.min.js"></script>
  <script src="assets/js/gsap-split-text.min.js"></script>
  <script src="assets/js/jquery.nice-select.min.js"></script>
  <script src="assets/js/swiper.min.js"></script>
  <script src="assets/js/odometer.min.js"></script>
  <script src="assets/js/venobox.min.js"></script>
  <script src="assets/js/appear.min.js"></script>
  <script src="assets/js/wow.min.js"></script>
  <script src="assets/js/meanmenu.js"></script>
  <script src="assets/js/main.js"></script>
</body>

</html>
